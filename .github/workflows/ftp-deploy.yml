name: FTP Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  ftp-push:
    runs-on: ubuntu-latest
    # Skippt sauber, solange die FTP-Secrets nicht gesetzt sind
    if: ${{ vars.FTP_ENABLED == 'true' }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Per FTPS auf Webspace pushen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .python-version
            pyproject.toml
            uv.lock
            README.md
